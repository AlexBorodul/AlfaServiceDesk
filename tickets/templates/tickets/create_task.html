{% extends 'base.html' %}

{% block title %}Создать заявку - Alfa Service Desk{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Создать заявку</h2>
        <a href="{% url 'tasks' %}" class="btn btn-secondary">Назад</a>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Создать
            </button>
        </form>
    </div>
</div>
{% endblock %}
