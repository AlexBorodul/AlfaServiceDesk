{% extends 'base.html' %}

{% block title %}Создать письмо - Alfa Service Desk{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Написать письмо</h2>
        <a href="{% url 'tasks' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
    </div>
    
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Тема письма *</label>
                <input type="text" name="subject" class="form-control" required
                       placeholder="Введите тему письма">
            </div>

            <div class="form-group">
                <label class="form-label">Получатель *</label>
                <select name="recipient" class="form-control" required>
                    <option value="">Выберите получателя</option>
                    {% for employee in employees %}
                    <option value="{{ employee.email }}">
                        {{ employee.first_name }} {{ employee.second_name }} ({{ employee.email }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Сообщение *</label>
                <textarea name="message" class="form-control" rows="8" required
                          placeholder="Введите текст письма..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Прикрепить файлы</label>
                <input type="file" name="attachments" multiple class="form-control">
                <small style="color: var(--gray-500); font-size: 0.875rem; margin-top: 0.25rem;">
                    Можно прикрепить несколько файлов
                </small>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Отправить письмо
                </button>
                <a href="{% url 'tasks' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
