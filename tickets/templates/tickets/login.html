{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-headset fa-3x" style="color: #1a56db;"></i>
            <h2 style="margin-top: 1rem;">Alfa Service Desk</h2>
        </div>
        
        <h2 class="auth-title">Вход в систему</h2>
        
        {% if form.errors %}
        <div class="alert alert-error">
            Неверное имя пользователя или пароль.
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--gray-500); font-size: 0.9rem;">
            Корпоративная система управления заявками
        </div>
    </div>
</div>
{% endblock %}
