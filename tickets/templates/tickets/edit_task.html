{% extends 'base.html' %}

{% block title %}Редактировать заявку - Alfa Service Desk{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Редактировать заявку #{{ task.id }}</h2>
        <div>
            <a href="{% url 'task_detail' task.id %}" class="btn btn-secondary">Просмотр</a>
            <a href="{% url 'tasks' %}" class="btn btn-secondary">Назад</a>
        </div>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>
        </form>
    </div>
</div>
{% endblock %}
