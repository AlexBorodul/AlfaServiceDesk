<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks List</title>
</head>
<body>
    <h1>Tasks List</h1>
    <table>
        <thead>
            <tr>
                <th>title</th>
                <th>problem</th>
                <th>author</th>
                <th>worker</th>
                <th>office</th>
                <th>status</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
                <tr>
                    <td>{{ task.title }}</td>
                    <td>{{ task.problem }}</td>
                    <td>{{ task.author }}</td>
                    <td>{{ task.worker}}</td>
                    <td>{{ task.status}}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="6">No tasks available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <h2>Создать новую задачу</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Отображаем форму -->
            <button type="submit">Создать задачу</button>
</form>
</body>
</html>
